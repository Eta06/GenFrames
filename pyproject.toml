[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genframes"
version = "0.1.0"
description = "AI-powered video frame interpolation tool with RIFE model support"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "GenFrames Contributors"}
]
keywords = ["video", "frame-interpolation", "rife", "ai", "mlx", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "tqdm>=4.65.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
torch = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]
mlx = [
    "mlx>=0.20.0",
]
onnx = [
    "onnxruntime>=1.16.0",
]
ui = [
    "gradio>=4.0.0",
]
ffmpeg = [
    "ffmpeg-python>=0.2.0",
]
all = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "mlx>=0.20.0",
    "onnxruntime>=1.16.0",
    "gradio>=4.0.0",
    "ffmpeg-python>=0.2.0",
]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
genframes = "genframes.cli:main"

[project.urls]
Homepage = "https://github.com/Eta06/GenFrames"
Repository = "https://github.com/Eta06/GenFrames"

[tool.setuptools]
packages = ["genframes", "genframes.models", "genframes.backends", "genframes.video", "genframes.ui"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 100
target-version = "py39"
