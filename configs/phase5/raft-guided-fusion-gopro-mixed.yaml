  synthetic_weight: 0.15
  gopro_within_real_weight: 0.8
  davis_within_real_weight: 0.2
  crop_size: 256
  gopro_license: CC-BY-4.0

training:
  steps: 1500
  batch_size: 8
  learning_rate: 0.0001
  amp: true
  seed: 6101

loss:
  charbonnier_weight: 1.0
  edge_weight: 0.1
  synthetic_visibility_weight: 0.05

artifact:
  contains_raft_weights: false
  filename: fusion.safetensors
